<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="60%" stop-color="#0f0720"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background (Rounded Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Turntable Platter Outer Ring -->
  <circle cx="230" cy="270" r="170" fill="#12121a" stroke="#2a2838" stroke-width="4"/>
  <circle cx="230" cy="270" r="156" fill="#181824" stroke="url(#neonGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Vinyl Grooves -->
  <circle cx="230" cy="270" r="140" fill="none" stroke="#252538" stroke-width="2"/>
  <circle cx="230" cy="270" r="125" fill="none" stroke="#2e2e42" stroke-width="1.5"/>
  <circle cx="230" cy="270" r="110" fill="none" stroke="#252538" stroke-width="2"/>
  <circle cx="230" cy="270" r="95" fill="none" stroke="#2e2e42" stroke-width="1.5"/>
  <circle cx="230" cy="270" r="80" fill="none" stroke="#252538" stroke-width="2"/>

  <!-- Vinyl Center Label -->
  <circle cx="230" cy="270" r="62" fill="url(#neonGrad)" filter="url(#glow)"/>
  <circle cx="230" cy="270" r="54" fill="#0f0720"/>
  <circle cx="230" cy="270" r="14" fill="#ec4899"/>
  <circle cx="230" cy="270" r="5" fill="#ffffff"/>

  <!-- Audio Equalizer Wave Bars on Top Right -->
  <g transform="translate(320, 80)">
    <rect x="0" y="70" width="8" height="50" rx="4" fill="#06b6d4" opacity="0.9"/>
    <rect x="14" y="40" width="8" height="80" rx="4" fill="#3b82f6" opacity="0.9"/>
    <rect x="28" y="20" width="8" height="100" rx="4" fill="#8b5cf6" opacity="0.9"/>
    <rect x="42" y="50" width="8" height="70" rx="4" fill="#a855f7" opacity="0.9"/>
    <rect x="56" y="10" width="8" height="110" rx="4" fill="#d946ef" opacity="0.9"/>
    <rect x="70" y="35" width="8" height="85" rx="4" fill="#ec4899" opacity="0.9"/>
    <rect x="84" y="60" width="8" height="60" rx="4" fill="#f43f5e" opacity="0.9"/>
  </g>

  <!-- Tonearm Stylus -->
  <g transform="translate(420, 160)">
    <!-- Base pivot -->
    <circle cx="0" cy="0" r="26" fill="#2d2b42" stroke="#4b4868" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#8b5cf6"/>
    <!-- Arm -->
    <path d="M 0 0 L -80 90 L -140 135" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cartridge headshell -->
    <rect x="-165" y="125" width="30" height="18" rx="4" transform="rotate(32 -150 134)" fill="url(#goldGrad)"/>
    <circle cx="-162" cy="144" r="3" fill="#ffffff"/>
  </g>

  <!-- DJ Mixer Control Dots / Knobs Bottom Right -->
  <g transform="translate(370, 370)">
    <circle cx="0" cy="0" r="16" fill="#1e1e2d" stroke="#06b6d4" stroke-width="3"/>
    <line x1="0" y1="-14" x2="0" y2="-4" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="45" cy="0" r="16" fill="#1e1e2d" stroke="#ec4899" stroke-width="3"/>
    <line x1="45" y1="-14" x2="45" y2="-4" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Badge text / Accent -->
  <path d="M 90 90 L 140 90 M 115 65 L 115 115" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>
